[package]
name = "fsr-qa-fixture-harness"
version = "1.0.0"
edition = "2021"
authors = ["FortiSOAR Forensics QA & CI Engineering Team"]
description = "Phase-6 Zero-Dependency Synthetic Forensic QA Fixture Generator, CI Benchmark Harness, and CISO/Board Demo Orchestrator for fsr-forensic-verdict."
license = "Apache-2.0"

[[bin]]
name = "fsr-qa-fixture-harness"
path = "src/main.rs"

[lib]
name = "fsr_qa_fixture_harness"
path = "src/lib.rs"

[dependencies]
fsr-deep-audit = { path = ".." }
fsr-net-crypto-audit = { path = "../fsr-net-crypto-audit" }
fsr-clone-cluster-audit = { path = "../fsr-clone-cluster-audit" }
fsr-supplychain-backdoor-audit = { path = "../fsr-supplychain-backdoor-audit" }
fsr-forensic-verdict = { path = "../fsr-forensic-verdict" }
# Zero external crates: 100% pure Rust standard library + internal workspace crates only.
