[package]
name = "fsr-forensic-verdict"
version = "1.0.0"
edition = "2021"
authors = ["FortiSOAR Forensics & DFIR Cryptographic Engineering Team"]
description = "Phase-5 Unified Forensic Command Center: 19-Engine Orchestrator, RFC 6962 Binary Merkle Evidence Sealer, Read-Only Non-Mutation Attestation, Causal Breach Verdict Classifier, Offline JSON/Markdown/HTML Emitter, and Standalone Evidence Bundle Verifier."
license = "Apache-2.0"

[[bin]]
name = "fsr-forensic-verdict"
path = "src/main.rs"

[lib]
name = "fsr_forensic_verdict"
path = "src/lib.rs"

[dependencies]
fsr-deep-audit = { path = ".." }
fsr-net-crypto-audit = { path = "../fsr-net-crypto-audit" }
fsr-clone-cluster-audit = { path = "../fsr-clone-cluster-audit" }
fsr-supplychain-backdoor-audit = { path = "../fsr-supplychain-backdoor-audit" }
fsr-remediation-advisor = { path = "../fsr-remediation-advisor" }
fsr-ova-attribution = { path = "../fsr-ova-attribution" }
# Zero external crates: pure Rust standard library + internal workspace engines only.
